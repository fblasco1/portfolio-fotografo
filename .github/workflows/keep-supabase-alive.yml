# Evita que el proyecto Free de Supabase se pause por inactividad (~7 días).
# Supabase exige "unas pocas" consultas a la DB casi cada día de la semana;
# 3 pings/semana no bastaron (el proyecto se pausó igual).
#
# Variables de repositorio (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
# URL y anon key son públicas por diseño; no hace falta Secrets.
#
# Nota: los cron de GitHub Actions solo corren en la rama default (master).

name: Keep Supabase Alive

on:
  schedule:
    # Dos veces al día (00:00 y 12:00 AR / 03:00 y 15:00 UTC).
    # GitHub puede demorar el cron; el doble margen reduce huecos >24h.
    - cron: '0 3,15 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase (DB + Auth)
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Faltan variables NEXT_PUBLIC_SUPABASE_URL o NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}"
          AUTH_HEADER="Authorization: Bearer ${SUPABASE_ANON_KEY}"
          API_HEADER="apikey: ${SUPABASE_ANON_KEY}"

          ping_url() {
            local label="$1"
            local url="$2"
            local body_file
            body_file="$(mktemp)"
            local code
            code=$(curl -sS -o "${body_file}" -w "%{http_code}" \
              --connect-timeout 20 \
              --max-time 60 \
              -H "${API_HEADER}" \
              -H "${AUTH_HEADER}" \
              -H "Accept: application/json" \
              "${url}" || true)
            echo "${label}: HTTP ${code} → ${url}"
            head -c 300 "${body_file}" || true
            echo
            case "${code}" in
              2??|4??) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Varias consultas a la DB (lo que Supabase cuenta como actividad).
          FAIL=0
          ping_url "orders" "${BASE_URL}/rest/v1/orders?select=id&limit=1" || FAIL=1
          ping_url "orders-count" "${BASE_URL}/rest/v1/orders?select=id&limit=1&offset=0" || FAIL=1
          # Auth health: actividad de servicio (complemento; la DB es lo crítico).
          ping_url "auth-health" "${BASE_URL}/auth/v1/health" || FAIL=1

          if [ "${FAIL}" -ne 0 ]; then
            echo "::error::Supabase no respondió bien. ¿Proyecto pausado o caída de red/DNS?"
            exit 1
          fi

          echo "OK: actividad registrada; proyecto activo"
